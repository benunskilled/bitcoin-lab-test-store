name: Peer Lab store entry
# The code and its tests live in benunskilled/peer-lab. What stays here is
# the store entry, and the store reads it as YAML: a file that does not parse
# hides the app from the store without a word (an apostrophe in a
# single-quoted description did, 12.11.2026).
on:
  push:
    branches: ['**']
    paths: ['peer-lab/**', 'bltest-peerlab/**', '.github/workflows/peer-lab.yml']
  pull_request:
    paths: ['peer-lab/**', 'bltest-peerlab/**', '.github/workflows/peer-lab.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # A block, not a plain line: in a plain YAML line " #" starts a comment
      # and cut the command short (12.11.2026).
      - run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "ok #{f}" }' peer-lab/umbrel/bltest-peerlab/*.yml bltest-peerlab/*.yml umbrel-app-store.yml
