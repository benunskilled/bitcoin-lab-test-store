manifestVersion: 1
id: bltest-peerlab
category: bitcoin
name: Peer Lab (Test)
version: "0.1.0-test.4.1"
tagline: Pre-release test build - not for general use
description: 'Test build of Peer Lab: peer map and classification, block delivery ranking, Slot Fill and Stratum Race in one app. It starts read-only, so it never adds, removes or disconnects peers and can run next to other apps. It keeps its own data on port 8796. Geolocation and ASN data by DB-IP (CC BY 4.0); map data by Natural Earth.'
releaseNotes: ''
developer: benunskilled
website: https://github.com/benunskilled/bitcoin-lab-test-store
dependencies:
- bitcoin
repo: https://github.com/benunskilled/bitcoin-lab-test-store
support: https://github.com/benunskilled/bitcoin-lab-test-store/issues
icon: https://raw.githubusercontent.com/benunskilled/bitcoin-lab-test-store/main/bltest-peerlab/icon.png
port: 8796
gallery: []
path: ''
defaultUsername: ''
defaultPassword: ''
widgets:
- id: traffic
  type: three-stats
  refresh: 60s
  endpoint: dashboard:8788/api/widget/traffic
  link: ''
  example:
    type: three-stats
    link: ''
    items:
    - text: 8.4 GB
      subtext: sent today
    - text: 1.9 GB
      subtext: received today
    - text: 8 / 10
      subtext: peers in / out
submitter: benunskilled
submission: ''
storage:
  dataRoot: data
